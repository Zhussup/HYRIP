[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hyrip"
dynamic = ["version"]
description = "Hyrip — IELTS reading comprehension trainer: AI question papers from any article, via Ollama Cloud"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["ielts", "reading", "training", "ollama"]
dependencies = [
    "pydantic>=2.8",
    "httpx>=0.27",
    "rich>=13.7",
    "trafilatura>=1.12",
]

[project.optional-dependencies]
web = ["fastapi>=0.111", "uvicorn>=0.30"]
qt = ["PySide6>=6.8"]
all = ["fastapi>=0.111", "uvicorn>=0.30", "PySide6>=6.8"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "respx>=0.21",
    "ruff>=0.5",
    "pytest-qt>=4.4",
]

[project.scripts]
hyrip = "hyrip.cli.app:main"

[tool.hatch.version]
path = "src/hyrip/version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/hyrip"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "PTH"]
# RUF001: curly quotes / en-dashes are intentional in a text-matching app (quote normalization)
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
omit = ["src/hyrip/qt/*", "src/hyrip/cli/*", "src/hyrip/web/*"]

[tool.coverage.report]
skip_covered = true